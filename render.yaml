services:
  - type: web
    name: foplayer-api
    runtime: node
    plan: free
    region: singapore
    rootDir: apps/api
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
