name: Android Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the signed App Bundle to Google Play internal testing
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: foplayer-android-release
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK and Play Store App Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate Android project with the production application ID
        run: |
          set -euo pipefail
          # Discard only generated Android scaffolding when it still references the removed v1 embedding.
          if grep -R -E 'io\.flutter\.app\.FlutterActivity|io\.flutter\.app\.FlutterApplication|GeneratedPluginRegistrant\.registerWith' android/app/src/main 2>/dev/null; then
            echo "Detected deprecated Android v1 embedding; regenerating Android platform files."
            rm -rf android
          fi
          if [ ! -f android/app/build.gradle.kts ] && [ ! -f android/app/build.gradle ]; then
            flutter create --platforms=android --org com.nipun.finance --project-name fno .
          fi
          if grep -R -n -E 'io\.flutter\.app\.FlutterActivity|io\.flutter\.app\.FlutterApplication|GeneratedPluginRegistrant\.registerWith' android/app/src/main 2>/dev/null; then
            echo "::error::Deprecated Android v1 embedding remains after scaffolding generation."
            exit 1
          fi
          sed -i 's/android:label="[^"]*"/android:label="FnO Players"/' android/app/src/main/AndroidManifest.xml
          grep -q 'com.nipun.finance.fno' android/app/build.gradle.kts android/app/build.gradle 2>/dev/null || {
            echo "::error::Generated Android application ID is not com.nipun.finance.fno"
            exit 1
          }

          # Install a native diagnostic bridge in the generated Android scaffold.
          # It reports the certificate of the APK actually installed (Play App Signing
          # certificate for Play installs), not just the CI upload certificate.
          MAIN_ACTIVITY="android/app/src/main/kotlin/com/nipun/finance/fno/MainActivity.kt"
          mkdir -p "$(dirname "$MAIN_ACTIVITY")"
          cat > "$MAIN_ACTIVITY" <<'KOTLIN'
          package com.nipun.finance.fno

          import android.content.pm.PackageInfo
          import android.content.pm.PackageManager
          import android.os.Build
          import android.util.Log
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.ByteArrayInputStream
          import java.security.MessageDigest
          import java.security.cert.CertificateFactory
          import java.security.cert.X509Certificate

          class MainActivity : FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      "com.nipun.finance.fno/auth_diagnostics"
                  ).setMethodCallHandler { call, result ->
                      if (call.method != "signingInfo") {
                          result.notImplemented()
                      } else {
                          try {
                              val signatures = signingCertificates()
                              val certificates = signatures.map { signature ->
                                  CertificateFactory.getInstance("X.509")
                                      .generateCertificate(
                                          ByteArrayInputStream(signature.toByteArray())
                                      ) as X509Certificate
                              }
                              val sha1 = certificates.map { fingerprint(it, "SHA-1") }
                              val sha256 = certificates.map { fingerprint(it, "SHA-256") }
                              val resourceId = resources.getIdentifier(
                                  "default_web_client_id", "string", packageName
                              )
                              val webClientId = if (resourceId == 0) "" else getString(resourceId)
                              val diagnostic = mapOf(
                                  "packageName" to packageName,
                                  "signerSha1" to sha1.joinToString(","),
                                  "signerSha256" to sha256.joinToString(","),
                                  "webClientId" to webClientId
                              )
                              Log.i(
                                  "FOPLAYER_AUTH_DIAGNOSTICS",
                                  diagnostic.entries.joinToString(" ") { "${it.key}=${it.value}" }
                              )
                              result.success(diagnostic)
                          } catch (error: Exception) {
                              Log.e("FOPLAYER_AUTH_DIAGNOSTICS", "Could not read signing identity", error)
                              result.error("SIGNING_DIAGNOSTICS_FAILED", error.message, null)
                          }
                      }
                  }
              }

              @Suppress("DEPRECATION")
              private fun signingCertificates(): List<android.content.pm.Signature> {
                  val info: PackageInfo = if (Build.VERSION.SDK_INT >= 33) {
                      packageManager.getPackageInfo(
                          packageName,
                          PackageManager.PackageInfoFlags.of(
                              PackageManager.GET_SIGNING_CERTIFICATES.toLong()
                          )
                      )
                  } else if (Build.VERSION.SDK_INT >= 28) {
                      packageManager.getPackageInfo(
                          packageName, PackageManager.GET_SIGNING_CERTIFICATES
                      )
                  } else {
                      packageManager.getPackageInfo(packageName, PackageManager.GET_SIGNATURES)
                  }
                  val signatures = if (Build.VERSION.SDK_INT >= 28) {
                      info.signingInfo?.apkContentsSigners
                  } else {
                      info.signatures
                  }
                  return signatures?.toList()
                      ?: throw IllegalStateException("No app signing certificate was found")
              }

              private fun fingerprint(certificate: X509Certificate, algorithm: String): String =
                  MessageDigest.getInstance(algorithm).digest(certificate.encoded)
                      .joinToString(":") { byte -> "%02X".format(byte.toInt() and 0xff) }
          }
          KOTLIN

      - name: Validate required release configuration
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
          ANDROID_APPLICATION_ID: ${{ vars.ANDROID_APPLICATION_ID }}
          FOPLAYER_API_BASE_URL: ${{ vars.FOPLAYER_API_BASE_URL }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in FIREBASE_GOOGLE_SERVICES_JSON ANDROID_APPLICATION_ID FOPLAYER_API_BASE_URL ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub secret/variable: $key. Configure it before running a signed release."
              exit 1
            fi
          done
          case "$FOPLAYER_API_BASE_URL" in
            https://*) ;;
            *) echo "::error::FOPLAYER_API_BASE_URL must be an HTTPS URL."; exit 1 ;;
          esac
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > android/app/google-services.json
          python3 - <<'PY'
          import json, os
          with open("android/app/google-services.json", encoding="utf-8") as f:
              data = json.load(f)
          expected = os.environ["ANDROID_APPLICATION_ID"]
          packages = {
              c.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for c in data.get("client", [])
          }
          if expected not in packages:
              raise SystemExit(f"Firebase config does not contain Android package {expected}")
          web_clients = [
              oauth.get("client_id")
              for client in data.get("client", [])
              for oauth in client.get("oauth_client", [])
              if oauth.get("client_type") == 3 and oauth.get("client_id")
          ]
          if not web_clients:
              raise SystemExit("Firebase config has no web OAuth client; configure Google Sign-In in Firebase.")
          certificate_hashes = sorted({
              oauth.get("android_info", {}).get("certificate_hash")
              for client in data.get("client", [])
              for oauth in client.get("oauth_client", [])
              if oauth.get("client_type") == 1 and oauth.get("android_info", {}).get("certificate_hash")
          })
          print(f"FOPLAYER_FIREBASE_PROJECT_ID={data.get('project_info', {}).get('project_id', 'unknown')}")
          print(f"FOPLAYER_ANDROID_PACKAGE={expected}")
          print("FOPLAYER_WEB_OAUTH_CLIENT_IDS=" + ",".join(web_clients))
          print("FOPLAYER_FIREBASE_ANDROID_OAUTH_CERTIFICATE_HASHES=" + ",".join(certificate_hashes))
          print("Firebase Android package and web OAuth client validated.")
          PY

      - name: Apply Google Services Gradle plugin
        run: |
          set -euo pipefail
          if [ -f android/app/build.gradle.kts ]; then
            grep -q 'com.google.gms.google-services' android/app/build.gradle.kts || sed -i '/plugins {/a\\    id("com.google.gms.google-services") version "4.4.2"' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            grep -q 'com.google.gms.google-services' android/app/build.gradle || sed -i "/plugins {/a\\    id 'com.google.gms.google-services' version '4.4.2'" android/app/build.gradle
          else
            echo "::error::No Android Gradle app build file found."
            exit 1
          fi

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
          echo "=== FnO Player CI upload certificate fingerprints (not necessarily the Play App Signing certificate) ==="
          keytool -list -v -keystore android/release-keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" |
            awk '/SHA1:/{print "FOPLAYER_UPLOAD_KEY_SHA1=" $2} /SHA256:/{print "FOPLAYER_UPLOAD_KEY_SHA256=" $2}'
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../release-keystore.jks
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re

          kotlin = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")
          if kotlin.exists():
              path = kotlin
              text = path.read_text()
              if "import java.util.Properties" not in text:
                  text = "import java.util.Properties\n" + text
              if "signingConfigs {" not in text:
                  marker = "    buildTypes {"
                  if marker not in text:
                      raise SystemExit("Could not find buildTypes block in Kotlin Gradle file.")
                  signing = '''    signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

          '''
                  text = text.replace(marker, signing + marker, 1)
              if "val keystoreProperties =" not in text:
                  marker = "android {"
                  if marker not in text:
                      raise SystemExit("Could not find android block in Kotlin Gradle file.")
                  props = '''val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          keystorePropertiesFile.inputStream().use { keystoreProperties.load(it) }

          '''
                  text = text.replace(marker, props + marker, 1)
              text = text.replace('signingConfig = signingConfigs.getByName("debug")',
                                  'signingConfig = signingConfigs.getByName("release")')
              if not re.search(r'signingConfig\s*=\s*signingConfigs\.getByName\("release"\)', text):
                  match = re.search(r'(buildTypes\s*\{\s*getByName\("release"\)\s*\{)', text)
                  if not match:
                      match = re.search(r'(buildTypes\s*\{\s*release\s*\{)', text)
                  if not match:
                      raise SystemExit("Could not find release build type to apply release signing.")
                  text = text[:match.end()] + '\n            signingConfig = signingConfigs.getByName("release")' + text[match.end():]
              path.write_text(text)
          elif groovy.exists():
              path = groovy
              text = path.read_text()
              if "signingConfigs {" not in text:
                  marker = "    buildTypes {"
                  if marker not in text:
                      raise SystemExit("Could not find buildTypes block in Groovy Gradle file.")
                  signing = '''    signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }

          '''
                  text = text.replace(marker, signing + marker, 1)
              if "keystoreProperties =" not in text:
                  marker = "android {"
                  props = '''def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

          '''
                  text = text.replace(marker, props + marker, 1)
              text = text.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
              if not re.search(r'signingConfig\s+signingConfigs\.release', text):
                  match = re.search(r'(buildTypes\s*\{\s*release\s*\{)', text)
                  if not match:
                      raise SystemExit("Could not find release build type to apply release signing.")
                  text = text[:match.end()] + '\n            signingConfig signingConfigs.release' + text[match.end():]
              path.write_text(text)
          else:
              raise SystemExit("No Android app Gradle build file found.")

          print("Configured Android release build type to use the uploaded release keystore.")
          PY

      - name: Generate release version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          BASE_VERSION=$(sed -n 's/^version: \([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*$/\1/p' pubspec.yaml)
          test -n "$BASE_VERSION"
          VERSION_CODE=$((RUN_NUMBER * 100 + RUN_ATTEMPT))
          echo "name=$BASE_VERSION.$RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Release version: $BASE_VERSION.$RUN_NUMBER (versionCode $VERSION_CODE)"

      - name: Build signed APK for direct testing
        run: flutter build apk --release --build-name="${{ steps.version.outputs.name }}" --build-number="${{ steps.version.outputs.code }}" --dart-define=FOPLAYER_API_BASE_URL="${{ vars.FOPLAYER_API_BASE_URL }}"

      - name: Build signed Android App Bundle for Google Play
        run: flutter build appbundle --release --build-name="${{ steps.version.outputs.name }}" --build-number="${{ steps.version.outputs.code }}" --dart-define=FOPLAYER_API_BASE_URL="${{ vars.FOPLAYER_API_BASE_URL }}"

      - name: Report and verify release APK certificate fingerprints
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          APK="build/app/outputs/flutter-apk/app-release.apk"
          UPLOAD_CERTS=$(keytool -list -v -keystore android/release-keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS")
          UPLOAD_SHA1=$(printf '%s\n' "$UPLOAD_CERTS" | awk -F': ' '/SHA1:/{print $2; exit}')
          UPLOAD_SHA256=$(printf '%s\n' "$UPLOAD_CERTS" | awk -F': ' '/SHA256:/{print $2; exit}')
          APK_CERTS=$("$BUILD_TOOLS_DIR/apksigner" verify --print-certs "$APK")
          APK_SHA1=$(printf '%s\n' "$APK_CERTS" | sed -n 's/^Signer #1 certificate SHA-1 digest: //p' | head -n 1)
          APK_SHA256=$(printf '%s\n' "$APK_CERTS" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          for value in "$UPLOAD_SHA1" "$UPLOAD_SHA256" "$APK_SHA1" "$APK_SHA256"; do
            if [ -z "$value" ]; then
              echo "::error::Could not read upload or APK signing fingerprints."
              exit 1
            fi
          done
          echo "FOPLAYER_UPLOAD_KEY_SHA1=$UPLOAD_SHA1"
          echo "FOPLAYER_UPLOAD_KEY_SHA256=$UPLOAD_SHA256"
          echo "FOPLAYER_RELEASE_APK_SHA1=$APK_SHA1"
          echo "FOPLAYER_RELEASE_APK_SHA256=$APK_SHA256"
          normalize_fingerprint() { printf '%s' "$1" | tr -d ':' | tr '[:lower:]' '[:upper:]'; }
          if [ "$(normalize_fingerprint "$UPLOAD_SHA1")" != "$(normalize_fingerprint "$APK_SHA1")" ] ||
             [ "$(normalize_fingerprint "$UPLOAD_SHA256")" != "$(normalize_fingerprint "$APK_SHA256")" ]; then
            echo "::error::Release APK signer does not match the configured upload certificate."
            exit 1
          fi
          echo "Verified: release APK is signed with the configured upload certificate."
          echo "For Google Play installs, use the runtime signer fingerprints logged by FOPLAYER_AUTH_DIAGNOSTICS."

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/bundle/release/app-release.aab
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab >/dev/null
          sha256sum build/app/outputs/flutter-apk/app-release.apk build/app/outputs/bundle/release/app-release.aab

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: foplayer-release-${{ steps.version.outputs.name }}
          path: |
            apps/flutter/build/app/outputs/flutter-apk/app-release.apk
            apps/flutter/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish to Google Play internal testing
        if: ${{ inputs.publish }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.ANDROID_APPLICATION_ID }}
          releaseFiles: apps/flutter/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
